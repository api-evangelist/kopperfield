aid: kopperfield
name: Kopperfield
description: >-
  Kopperfield is a software company building design and permitting tools for electrical contractors,
  electricians, inspectors and instructors. Founded in 2022, the company started as an EV charger
  installation booking service and has since become a broader contractor platform whose stated mission
  is to "accelerate home electrification by giving contractors the tools they need to work faster,
  smarter, and with total confidence." The web and mobile product covers NEC-compliant residential and
  commercial load calculations, drag-and-drop single line diagrams, panel schedules with circuit
  directories, AI panel-photo analysis, and a National Electrical Code chatbot trained on the 2017,
  2020 and 2023 code editions. Kopperfield publishes a public llms.txt and a public status page but
  does not currently operate a public developer program: there is no published API reference, OpenAPI
  definition, SDK, or developer portal, and robots.txt disallows crawling of /api/. The company is
  backed by General Catalyst, MCJ Collective, Lachy Groom and Designer Fund.
